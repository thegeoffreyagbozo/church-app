# Repo-wide Dart analysis settings (used by `melos analyze`).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Generated files are excluded; missing generated parts shouldn't fail analysis pre-codegen.
    uri_has_not_been_generated: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/generated/**"

linter:
  rules:
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - avoid_print
