name: notation_example
description: Shows Verovio drawing a hymn, and times it for the go/no-go.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  notation: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  xml: ^6.5.0

flutter:
  uses-material-design: true
  # Git-ignored: MusicXML files dropped here show up in the viewer's hymn menu.
  assets:
    - local/
