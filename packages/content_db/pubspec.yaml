name: content_db
description: The hymn book as an on-phone SQLite database (drift), its search, and the tool
  that builds it from a church's Supabase project (ADR 0001, ADR 0009).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

# Part of the root Dart pub workspace.
resolution: workspace

executables:
  build_content_db:

dependencies:
  args: ^2.7.0
  drift: ^2.34.4
  http: ^1.6.0
  path: ^1.9.1
  shared: ^0.1.0
  sqlite3: ^3.5.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  lints: ^6.1.0
  test: ^1.25.8
