name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# The admin (React) job is added when that package lands (docs/ARCHITECTURE.md,
# Implementation step 7).
jobs:
  dart:
    name: Dart packages (analyze, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace includes the Flutter app, so every job resolves with Flutter's SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7   # Dart 3.13.5, the SDK that wrote pubspec.lock
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages
      - name: Generate the drift code (git-ignored)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/content_db
      - name: Analyze
        run: dart analyze --fatal-infos packages
      - name: Test the importer
        run: dart test
        working-directory: packages/content_import
      - name: Test the hymn book database
        run: dart test
        working-directory: packages/content_db

  mobile:
    name: Flutter app (analyze, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get   # also generates the English strings (gen-l10n)
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed apps/mobile
      - name: Generate the drift code (git-ignored)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/content_db
      - name: Bundle the public-domain sample hymn book (church content stays out of git)
        run: >
          dart run content_db:build_content_db
          --from-json packages/content_db/test/fixtures/sample_content.json
          --out apps/mobile/assets/content/content.db
      - name: Analyze
        run: flutter analyze
        working-directory: apps/mobile
      - name: Test (unit, widget, accessibility, golden screenshots)
        run: flutter test
        working-directory: apps/mobile

  backend:
    name: Supabase migrations + seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to match the local CLI; resolving "latest" can hit GitHub API rate limits.
          version: 2.120.0
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations + seed (validates they load cleanly)
        run: supabase db reset   # applies all migrations then runs seed.sql
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Import a sample hymn book twice and check the result
        run: |
          flutter pub get
          (cd packages/content_import && dart run content_import \
            test/fixtures/sample_book.txt --out /tmp/sample_book.sql --year 2026)
          db=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # The second import must update the same rows, not duplicate them.
          psql "$db" -v ON_ERROR_STOP=1 -q -f /tmp/sample_book.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f /tmp/sample_book.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f packages/content_import/test/fixtures/expect_sample_book.sql
      - name: Export local Supabase API settings
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_KEY |
            awk '
              /^(SUPABASE_URL|SUPABASE_KEY)=/ {
                name = $0
                sub(/=.*/, "", name)
                value = $0
                sub(/^[^=]*=/, "", value)
                sub(/^"/, "", value)
                sub(/"$/, "", value)
                print name "=" value
              }
            ' >> "$GITHUB_ENV"
      - name: Build a hymn book from the sample through the public API
        run: |
          : "${SUPABASE_URL:?Supabase did not provide SUPABASE_URL}"
          : "${SUPABASE_KEY:?Supabase did not provide SUPABASE_KEY}"
          (cd packages/content_db && dart run build_runner build --delete-conflicting-outputs)
          cd packages/content_db && dart test test/supabase_build_test.dart
      - name: RLS tests (pgTAP) — placeholder until supabase/tests/ exists
        run: |
          if [ -d supabase/tests ]; then supabase test db; else echo "no pgTAP tests yet"; fi
