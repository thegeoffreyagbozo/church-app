name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# The mobile (Flutter) and admin (React) jobs are added to this file when those packages
# land (see docs/ARCHITECTURE.md → Implementation steps 5 & 7). Until then CI validates the
# backend, which is the part that exists.
jobs:
  backend:
    name: Supabase migrations + seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to match the local CLI; resolving "latest" can hit GitHub API rate limits.
          version: 2.120.0
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations + seed (validates they load cleanly)
        run: supabase db reset   # applies all migrations then runs seed.sql
      - name: RLS tests (pgTAP) — placeholder until supabase/tests/ exists
        run: |
          if [ -d supabase/tests ]; then supabase test db; else echo "no pgTAP tests yet"; fi
