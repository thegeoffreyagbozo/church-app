name: Keepalive

# Supabase free projects pause after ~7 days idle, which would stop sync/reminders/webhooks.
# An internal cron can't wake a paused project, so this EXTERNAL ping hits the public `health`
# Edge Function daily (which touches the DB). See docs/ARCHITECTURE.md → operational must-dos.
#
# Required repo secret: HEALTH_URL = https://<project-ref>.supabase.co/functions/v1/health
# NOTE: scheduled workflows only run from the default branch, so this activates after merge.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily (off-the-hour to avoid scheduler congestion)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ secrets.HEALTH_URL }}" ]; then
            echo "HEALTH_URL secret not set yet — skipping."; exit 0
          fi
          curl --fail --silent --show-error --max-time 60 "${{ secrets.HEALTH_URL }}" | tee /dev/stderr
