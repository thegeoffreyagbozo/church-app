# The repo-wide rules (../../analysis_options.yaml) plus Flutter's recommended lints.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - avoid_print
