name: church_app
description: The congregation app. Piece 1 is the hymn book and readings, fully offline
  (see docs/decisions/0009-reading-experience.md).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Part of the root Dart pub workspace.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  content_db: ^0.1.0
  device_info_plus: ^13.3.0
  drift: ^2.34.4
  flutter_svg: ^2.2.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.2
  lucide_flutter: ^1.47.0
  notation: ^0.1.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared: ^0.1.0
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1
  super_sliver_list: ^0.4.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.12.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Built by `dart run content_db:build_content_db` and git-ignored (church content).
    - assets/content/
    # Sheet music beside content.db, written by the same build (ADR 0011).
    - assets/content/music/
    - assets/fonts/licenses/

  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
